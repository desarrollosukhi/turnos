<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      // Redirect 404 to index.html for SPA routing on GitHub Pages
      var pathSegmentsToKeep = 1; // /turnos/
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~') : '')
      );
    </script>
  </head>
  <body></body>
</html>
