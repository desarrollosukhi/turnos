<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Reservas</title>
    <script>
      // Redirect 404 to index.html for SPA routing on GitHub Pages
      if (window.location.search && window.location.search.indexOf('?/') === 0) {
        var path = window.location.search.replace('?/', '').replace(/~/g, '&');
        var hash = window.location.hash || '';
        window.history.replaceState(null, '', '/turnos/' + path + hash);
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
